[package]
name = "agent_rs"
version = "0.2.1"
edition = "2024"

[lib]
name = "agent_rs_lib"
crate-type = ["rlib"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[dependencies]
anyhow = "1.0.102"
dotenvy = "0.15.7"
rig-core = { version = "0.36.0", features = ["rmcp"] }
rmcp = { version = "1.6.0", features = [
    "client",
    "macros",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "transport-child-process",
] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.150"
url = "2.5.8"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
pdf-extract = "0.10.0"
thiserror = "2.0.18"
glob = "0.3.3"
async-trait = "0.1.88"

[dev-dependencies]
tempfile = "3.27.0"
