[package]
name = "rs_agent"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[dependencies]
anyhow = "1.0.102"
dotenvy = "0.15.7"
rig-core = { version = "0.35.0", features = ["rmcp"] }
rmcp = { version = "1.5.0", features = ["client", "macros", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "transport-child-process"] }
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
url = "2.5.4"
reqwest = { version = "0.12.12", features = ["json", "stream"] }
async-trait = "0.1.89"
pdf-extract = "0.10.0"
