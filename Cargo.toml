[package]
name = "agent_rs"
version = "0.9.1"
license = "MIT"
readme = "README.md"
repository = "https://github.com/skaarfundgandr/agent_rs"
edition = "2024"

[lib]
name = "agent_rs"
crate-type = ["rlib"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "forbid"
unimplemented = "forbid"

[dependencies]
anyhow = "1.0.102"
dotenvy = "0.15.7"
rig-core = { version = "0.40.0", features = ["rmcp"] }
rmcp = { version = "1.7.0", features = [
    "client",
    "macros",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "transport-child-process",
] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.150"
url = "2.5.8"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
pdf-extract = "0.10.0"
thiserror = "2.0.18"
glob = "0.3.3"
async-trait = "0.1.88"
tiktoken-rs = "0.12.0"
tracing = "0.1.41"
futures = "0.3.31"
tempfile = "3.27.0"
rig-fastembed = { version = "0.40.0", optional = true }
rig-sqlite = { version = "0.40.0", optional = true }
tokio-rusqlite = { version = "0.6", optional = true }
turbovec = { version = "0.9.0", optional = true }
walkdir = { version = "2", optional = true }

# OpenTelemetry / LangSmith observability (optional, behind the `opentelemetry` feature)
opentelemetry = { version = "=0.32.0", optional = true, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", optional = true, default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.32.0", optional = true, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = { version = "=0.33.0", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry", "fmt", "std", "env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
axum = "0.8"

[features]
default = []
rag = ["rig-fastembed", "rig-sqlite", "tokio-rusqlite", "turbovec", "walkdir"]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[[example]]
name = "langsmith_react"
required-features = ["opentelemetry"]

[[example]]
name = "web_researcher"
required-features = ["rag"]

[[example]]
name = "multi_agent_coder"

[[example]]
name = "db_assistant"
